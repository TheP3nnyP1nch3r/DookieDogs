/* ============================================================
   Dookie Dogs — Color tokens
   Brand yellow + confident black. Warm, friendly, high-contrast.
   ============================================================ */
:root {
  /* --- Brand ------------------------------------------------ */
  --dd-yellow:        #FEC800;  /* the one. Signs, buckets, logo. */
  --dd-yellow-deep:   #E9B500;  /* hover / pressed on yellow      */
  --dd-yellow-soft:   #FFE58A;  /* tints, highlights              */
  --dd-yellow-wash:   #FFF6D6;  /* pale fill behind content       */

  /* --- Ink (near-black, never pure #000 for large fields) --- */
  --dd-ink:           #171512;  /* headings, primary text         */
  --dd-ink-2:         #3A3630;  /* body text                      */
  --dd-ink-3:         #6E6860;  /* muted / captions               */
  --dd-black:         #000000;  /* logo lockup, hard accents      */

  /* --- Neutrals / warm paper -------------------------------- */
  --dd-white:         #FFFFFF;
  --dd-paper:         #FBF9F4;  /* warm off-white page bg         */
  --dd-sand:          #F1ECE1;  /* section fill, dividers         */
  --dd-line:          #E4DED2;  /* hairline borders               */
  --dd-line-strong:   #C9C1B2;

  /* --- Support (used sparingly, from real photos/reviews) --- */
  --dd-grass:         #4C7A34;  /* "clean yard" / success accents */
  --dd-star:          #F5A623;  /* review stars (amber)           */

  /* ============================================================
     Semantic aliases — reference these in components
     ============================================================ */
  --color-bg:              var(--dd-paper);
  --color-surface:         var(--dd-white);
  --color-surface-sunk:    var(--dd-sand);
  --color-surface-brand:   var(--dd-yellow);
  --color-surface-ink:     var(--dd-ink);

  --text-heading:          var(--dd-ink);
  --text-body:             var(--dd-ink-2);
  --text-muted:            var(--dd-ink-3);
  --text-on-brand:         var(--dd-black);   /* black text on yellow */
  --text-on-ink:           var(--dd-white);

  --border-hairline:       var(--dd-line);
  --border-strong:         var(--dd-line-strong);
  --border-ink:            var(--dd-ink);

  --focus-ring:            var(--dd-ink);

  /* Links */
  --link:                  var(--dd-ink);
  --link-hover:            var(--dd-yellow-deep);
}

/* ============================================================
   Dookie Dogs — Typography tokens
   Display = Anton (condensed, uppercase, slanted like the logo).
   Text/UI  = Archivo.
   ============================================================ */
:root {
  --font-display: 'Anton', 'Arial Narrow', sans-serif;
  --font-text:    'Archivo', system-ui, -apple-system, sans-serif;

  /* Display headlines are ALWAYS uppercase + tight */
  --display-transform: uppercase;      /* @kind other */
  --display-tracking:  0.01em;         /* @kind other */
  --display-leading:   0.92;           /* @kind other */
  --display-slant:     -6deg;          /* @kind other */ /* transform: skewX() on hero marks */

  /* Weights (Archivo) */
  --fw-regular: 400;   /* @kind other */
  --fw-medium:  500;   /* @kind other */
  --fw-semibold:600;   /* @kind other */
  --fw-bold:    700;   /* @kind other */
  --fw-heavy:   800;   /* @kind other */

  /* Type scale (px in rem) */
  --fs-display-xxl: 6rem;      /* 96 — hero mark            */
  --fs-display-xl:  4.25rem;   /* 68 — page headline        */
  --fs-display-lg:  3rem;      /* 48 — section headline     */
  --fs-display-md:  2.125rem;  /* 34 — sub-headline         */

  --fs-title:   1.5rem;    /* 24 — card titles (Archivo 800)*/
  --fs-lg:      1.25rem;   /* 20 */

  --fs-sm:      0.9375rem; /* 15 */
  --fs-xs:      0.8125rem; /* 13 — labels, eyebrows         */

  --lh-tight:  1.05;   /* @kind other */
  --lh-snug:   1.25;   /* @kind other */
  --lh-body:   1.6;    /* @kind other */

  --eyebrow-tracking: 0.16em;  /* @kind other */
}

/* ============================================================
   Dookie Dogs — Spacing, radius, shadow, motion tokens
   ============================================================ */
:root {
  /* Spacing scale (4px base) */
  --sp-1: 0.25rem;   /* 4  */
  --sp-2: 0.5rem;    /* 8  */
  --sp-3: 0.75rem;   /* 12 */
  --sp-4: 1rem;      /* 16 */
  --sp-5: 1.5rem;    /* 24 */
  --sp-6: 2rem;      /* 32 */
  --sp-8: 3rem;      /* 48 */
  --sp-10: 4rem;     /* 64 */
  --sp-12: 6rem;     /* 96 */

  --container:      1200px;   /* @kind other */
  --container-text: 720px;    /* @kind other */

  /* Radius — friendly but not bubbly; buttons are pill/rounded */
  --r-sm:   6px;
  --r-md:   12px;
  --r-lg:   20px;
  --r-xl:   28px;
  --r-pill: 999px;

  /* Shadows — soft, warm, grounded (no colored glows) */
  --shadow-sm: 0 1px 2px rgba(23,21,18,0.06), 0 1px 3px rgba(23,21,18,0.08);
  --shadow-md: 0 4px 10px rgba(23,21,18,0.08), 0 2px 4px rgba(23,21,18,0.06);
  --shadow-lg: 0 16px 40px rgba(23,21,18,0.14);
  /* The signature "sticker" shadow: hard offset, no blur */
  --shadow-sticker: 4px 4px 0 var(--dd-ink);
  --shadow-sticker-yellow: 5px 5px 0 var(--dd-yellow);

  /* Motion */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);       /* @kind other */
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */
  --dur-fast: 120ms;   /* @kind other */
  --dur: 200ms;        /* @kind other */
  --dur-slow: 340ms;   /* @kind other */
}

/* ============================================================
   Dookie Dogs — component interaction states
   (hover / press / focus that inline styles can't express)
   ============================================================ */

/* Buttons */
.dd-btn:focus-visible { outline: 3px solid var(--dd-ink); outline-offset: 2px; }
.dd-btn--primary:hover:not(:disabled) { background: var(--dd-yellow-deep) !important; }
.dd-btn--ink:hover:not(:disabled)     { filter: brightness(1.18); }
.dd-btn--outline:hover:not(:disabled) { background: var(--dd-ink) !important; color: var(--dd-white) !important; }
.dd-btn--ghost:hover:not(:disabled)   { background: var(--dd-sand) !important; }
.dd-btn:active:not(:disabled)         { transform: scale(0.97); }
/* sticker press: shadow collapses and the button drops onto the page */
.dd-btn--sticker:active:not(:disabled){ transform: translate(4px,4px) scale(1); box-shadow: 0 0 0 var(--dd-ink) !important; }

/* Icon buttons */
.dd-iconbtn { transition: background var(--dur), transform var(--dur) var(--ease-bounce); }
.dd-iconbtn:hover  { background: var(--dd-sand); }
.dd-iconbtn:active { transform: scale(0.92); }
.dd-iconbtn--solid:hover  { background: var(--dd-yellow-deep); }

/* Cards that are interactive */
.dd-card--link { transition: transform var(--dur) var(--ease-out), box-shadow var(--dur); cursor: pointer; }
.dd-card--link:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }

/* Inputs */
.dd-input:focus { outline: none; border-color: var(--dd-ink) !important; box-shadow: 0 0 0 3px var(--dd-yellow-soft); }

@media (prefers-reduced-motion: reduce) {
  .dd-btn, .dd-iconbtn, .dd-card--link { transition: none; }
}

  .paybox { display:flex; gap:11px; background:var(--dd-sand); border-radius:12px; padding:14px; margin-top:16px; align-items:flex-start; }
  .paybox i { flex-shrink:0; margin-top:2px; color:var(--dd-ink); }
  .paybox strong { display:block; font-size:13.5px; color:var(--dd-ink); }
  .paybox span { display:block; font-size:12.5px; line-height:1.45; color:var(--dd-ink-3); margin-top:3px; }

  .sec { padding:58px 0; }
  .sec-lg { padding:82px 0; }
  .sec-head { text-align:center; max-width:720px; margin:0 auto 40px; }
  @media (max-width:640px){ .sec{ padding:40px 0; } .sec-lg{ padding:48px 0; } .sec-head{ margin-bottom:28px; } .sec-head p{ font-size:15.5px; } .band{ padding:48px 0; } }
  .sec-head:last-child { margin-bottom:0; }
  .sec-head h2 { font-size:clamp(30px,3.8vw,46px); }
  .sec-head .eyebrow { color:var(--dd-yellow-deep); margin-bottom:12px; }
  .sec-head p { font-size:17px; margin-top:14px; color:var(--dd-ink-2); line-height:1.6; }

  .rgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  .proofline { text-align:center; margin-top:30px; font-size:14.5px; font-weight:700; color:var(--dd-ink-2); }
  .proofline a { color:var(--dd-ink); text-decoration:underline; }

  .plans { display:grid; grid-template-columns:1fr 1fr; gap:24px; max-width:900px; margin:0 auto; align-items:stretch; }
  .onetime { text-align:center; margin:34px auto 0; font-size:14.5px; color:var(--dd-ink-3); }
  .onetime button { background:none; border:none; font-family:var(--font-text); font-size:14.5px; font-weight:800; color:var(--dd-ink); text-decoration:underline; cursor:pointer; padding:0; }

  .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:30px; }
  .stepwrap > div > div:first-child { width:132px !important; height:132px !important; }
  .stepwrap > div > div:first-child > i { width:56px !important; height:56px !important; }
  .stepwrap > div > div:first-child > span { width:40px !important; height:40px !important; font-size:1.35rem !important; top:-12px !important; right:-12px !important; }
  .stepwrap h3 { font-size:1.65rem !important; }
  .stepwrap p { font-size:1.02rem !important; max-width:320px !important; }

  .chips { display:flex; flex-wrap:wrap; gap:9px; justify-content:center; }
  .areamap-grid { display:grid; grid-template-columns:1.15fr 1fr; gap:34px; align-items:center; text-align:left; max-width:900px; margin:0 auto; }
  .areamap-img { border:3px solid #000; border-radius:18px; overflow:hidden; box-shadow:8px 8px 0 #000; transform:rotate(-1deg); background:#fff; }
  .areamap-img img { display:block; width:100%; height:auto; }
  .areamap-list h3 { font-family:var(--font-display); text-transform:uppercase; font-size:22px; color:var(--dd-ink); margin:0 0 6px; text-align:left; }
  .areamap-list > p { font-size:14.5px; color:var(--dd-ink-2); line-height:1.55; margin:0 0 16px; }
  .areamap-list .chips { justify-content:flex-start; }
  @media (max-width:720px){ .areamap-grid{ grid-template-columns:1fr; text-align:center; } .areamap-list h3, .areamap-list > p { text-align:center; } .areamap-list .chips { justify-content:center; } .areamap-img { transform:none; } }

  .pgrid { display:grid; grid-template-columns:1fr 1fr; gap:14px 28px; max-width:900px; margin:0 auto; }
  .prow { display:flex; gap:15px; align-items:flex-start; }
  .prow .pn { flex-shrink:0; width:30px; height:30px; border-radius:var(--r-pill); background:var(--dd-sand); color:var(--dd-ink); font-family:var(--font-display); font-size:15px; display:flex; align-items:center; justify-content:center; }
  .prow h3 { font-family:var(--font-display); text-transform:uppercase; font-size:17px; color:var(--dd-ink); margin:2px 0 5px; line-height:1.1; }
  .prow p { font-size:14.5px; line-height:1.5; color:var(--dd-ink-2); margin:0; }

  .video { background:var(--dd-ink); }
  .video .sec-head h2 { color:#fff; }
  .video .sec-head p { color:#a8a29a; }
  .video .sec-head .eyebrow { color:var(--dd-yellow); }
  .vgrid { display:grid; grid-template-columns:1fr 1fr; gap:32px; max-width:640px; margin:0 auto; }
  .vitem { display:flex; flex-direction:column; align-items:center; }
  .vitem .vcap { text-align:center; margin-top:16px; font-size:15px; font-weight:700; color:#fff; line-height:1.4; }
  @media (max-width:560px){ .vgrid{ grid-template-columns:1fr; max-width:300px; gap:36px; } }
  .vmain { width:100%; max-width:280px; margin:0 auto; border-radius:20px; overflow:hidden; border:3px solid #000; background:var(--dd-sand); aspect-ratio:9/16; position:relative; box-shadow:9px 9px 0 rgba(0,0,0,.4); }
  .vmain video { display:block; width:100%; height:100%; object-fit:cover; background:#000; }
  .vmain .vplaceholder { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:22px; background:var(--dd-sand); color:var(--dd-ink-3); font-size:13px; font-weight:700; line-height:1.55; }
  .vbelow { text-align:center; margin-top:22px; font-size:16px; font-weight:700; color:#fff; }

  .guar { background:var(--dd-white); }
  .guar-in { max-width:760px; margin:0 auto; text-align:center; }
  .guar .gi { width:64px; height:64px; margin:0 auto 20px; border-radius:50%; background:var(--dd-yellow); border:3px solid #000; display:flex; align-items:center; justify-content:center; box-shadow:4px 4px 0 #000; }
  .guar p { font-size:18px; line-height:1.65; color:var(--dd-ink-2); margin:16px 0 0; }
  .guar-photo { width:220px; margin:22px auto 0; border:3px solid #000; border-radius:14px; overflow:hidden; box-shadow:6px 6px 0 #000; }
  .guar-photo img { display:block; width:100%; height:auto; }

  .faq { max-width:760px; margin:0 auto; }
  .faq details { border-bottom:1px solid var(--dd-line); }
  .faq summary { list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 2px; font-weight:800; font-size:16.5px; color:var(--dd-ink); }
  .faq summary::-webkit-details-marker { display:none; }
  .faq summary .ic { transition:transform .25s; flex-shrink:0; }
  .faq details[open] summary .ic { transform:rotate(45deg); }
  .faq details p { margin:0 2px 18px; font-size:15.5px; line-height:1.6; color:var(--dd-ink-2); }
  .faq-cta { text-align:center; margin:30px 0; }

  .story-grid { display:grid; grid-template-columns:.8fr 1.2fr; gap:48px; align-items:center; }

  .band { background:var(--dd-yellow); text-align:center; padding:72px 0; }
  .band h2 { font-size:clamp(32px,4.4vw,54px); color:#000; }
  .band p { font-size:18px; font-weight:500; color:#231f18; max-width:540px; margin:16px auto 26px; }
  .band .sup { font-size:13.5px; font-weight:700; color:#4a4335; margin-top:18px; }
  .band .tlink { display:inline-block; margin-top:14px; font-size:14px; font-weight:700; color:#231f18; text-decoration:underline; }

  .footer { background:#0f0e0c; color:#a8a29a; padding:46px 0 28px; }
  .footer-grid { display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:36px; align-items:start; }
  .footer img.f-logo { height:38px; }
  .footer a { color:#d9d3c8; }
  .flink { display:block; margin-bottom:6px; font-size:14px; }
  .fcom { border-top:1px solid #26241f; margin-top:30px; padding-top:20px; font-size:13px; line-height:1.6; }
  .fcom a { text-decoration:underline; }

  .sticky-cta { position:fixed; right:22px; bottom:22px; z-index:70; background:var(--dd-yellow); border:2px solid #000; border-radius:999px; padding:12px 12px 12px 22px; box-shadow:6px 6px 0 #000; display:flex; align-items:center; gap:16px; opacity:0; pointer-events:none; transform:translateY(12px); transition:opacity .3s var(--ease-out), transform .3s var(--ease-out); }
  .sticky-cta.show { opacity:1; pointer-events:auto; transform:translateY(0); }
  .sticky-cta .lab { font-family:var(--font-display); text-transform:uppercase; color:#000; font-size:15px; line-height:1; white-space:nowrap; }
  .sticky-cta .lab small { display:block; font-family:var(--font-text); font-weight:700; font-size:11px; margin-top:3px; text-transform:none; }
  @media (max-width:560px){ .sticky-cta { left:0; right:0; bottom:0; border-radius:0; border-width:2px 0 0 0; box-shadow:none; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); justify-content:space-between; transform:translateY(100%); } .sticky-cta.show { transform:translateY(0); } .sticky-cta .lab small{ display:none; } }

  .reveal { opacity:0; transform:translateY(22px); transition:opacity .6s var(--ease-out), transform .6s var(--ease-out); }
  .reveal.in { opacity:1; transform:none; }

  @media (max-width:900px){
    .hero-grid{ grid-template-columns:1fr; gap:24px; grid-template-areas:"copy" "form"; } .hero{ padding:28px 0 52px; }
    .hero h1{ font-size:clamp(34px,9vw,46px); }
    .hero-proof-row{ display:none; }
    .hero-form-badge{ display:none; }
    .hero-grid{ gap:20px; }
    .steps,.rgrid{ grid-template-columns:1fr; }

    .plans{ grid-template-columns:1fr; }
    .story-grid{ grid-template-columns:1fr; } .story-photo{ height:280px; }
    body{ padding-bottom:74px; }
  }
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto;} .reveal{opacity:1!important;transform:none!important;} }
  body.kb-open .sticky-cta { display:none; }

/* ============================================================
   CONFIG — paste your IDs/URLs here. Page works without them.
   Production note: while SHEET_ENDPOINT is empty this page runs
   in PREVIEW MODE — leads are logged to console only, never
   delivered. Do not treat a preview "success" screen as a real
   lead until a live endpoint is configured below.
   ============================================================ */
const SHEET_ENDPOINT = "";
const STRIPE_LINKS = {
  // "Weekly|1":   "https://buy.stripe.com/xxxxxxxx",
  // "Biweekly|1": "https://buy.stripe.com/xxxxxxxx",
};
const META_PIXEL_ID  = "";
const GA_ID          = "";
const LP_VARIANT     = "v3-phone-after-schedule";

const PHONE = "270-266-1818", PHONE_RAW = "2702661818";
const FB = "https://www.facebook.com/dookiedogs/";
const GOOGLE = "https://maps.app.goo.gl/hj6cc3kmKZGWEeCs6";
const RATING = "5.0", REVIEW_COUNT = "25";

const STD_META = { ViewContent:1, Lead:1, CompleteRegistration:1, Contact:1, InitiateCheckout:1, Purchase:1, Schedule:1 };
function ddTrack(event, params){
  const p = Object.assign({ lp_variant: LP_VARIANT }, params||{});
  try { if(window.fbq){ STD_META[event] ? fbq('track', event, p) : fbq('trackCustom', event, p); } } catch(e){}
  try { if(window.gtag) gtag('event', event, p); } catch(e){}
  try { window.dataLayer && window.dataLayer.push(Object.assign({ event }, p)); } catch(e){}
  if(!window.fbq && !window.gtag) console.info('[track]', event, p);
}
function ddGetUTM(){
  const q = new URLSearchParams(window.location.search);
  const keep = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid'];
  const out = { lp_variant: LP_VARIANT, source_url: window.location.href, referrer: document.referrer||"" };
  keep.forEach(k=>{ const v=q.get(k); if(v) out[k]=v; });
  try { const s=JSON.parse(sessionStorage.getItem('dd_utm')||'{}'); Object.keys(s).forEach(k=>{ if(!out[k]) out[k]=s[k]; }); } catch(e){}
  try { sessionStorage.setItem('dd_utm', JSON.stringify(out)); } catch(e){}
  return out;
}
function ddSend(payload){
  if(!SHEET_ENDPOINT){
    console.warn("[Dookie Dogs] PREVIEW MODE \u2014 no live lead endpoint configured. This lead was NOT delivered:", payload);
    return Promise.resolve({ ok:true, preview:true });
  }
  return fetch(SHEET_ENDPOINT, { method:"POST", body:new URLSearchParams(payload) })
    .then(r => r.ok ? r.json().catch(()=>({ok:true})) : Promise.reject(new Error("HTTP "+r.status)))
    .then(d => (d && d.ok===false) ? { ok:false, error:d.error||"rejected" } : { ok:true, row:d&&d.row })
    .catch(e => ({ ok:false, error:String(e&&e.message||e) }));
}
const DD_PREVIEW = !SHEET_ENDPOINT;
function ddStripeLink(freq, dogs, yard, en){
  const base = STRIPE_LINKS[`${freq}|${dogs}|${yard}`] || STRIPE_LINKS[`${freq}|${dogs}`];
  if(!base) return null;
  const u = new URL(base);
  if(en && en.email) u.searchParams.set('prefilled_email', en.email);
  u.searchParams.set('client_reference_id', 'dd_'+Date.now().toString(36));
  return u.toString();
}

function StickyCTA(){
  const [scrolled,setScrolled] = useState(false);
  const [nearQuote,setNearQuote] = useState(false);
  const [nearFooter,setNearFooter] = useState(false);
  const [kbOpen,setKbOpen] = useState(false);
  useEffect(()=>{
    const onScroll = ()=>setScrolled(window.scrollY>520);
    onScroll(); addEventListener('scroll', onScroll, { passive:true });
    const q = document.getElementById('quote');
    const f = document.querySelector('.footer');
    const ioQ = q && new IntersectionObserver(([e])=>setNearQuote(e.isIntersecting), { threshold:0.15 });
    q && ioQ.observe(q);
    const ioF = f && new IntersectionObserver(([e])=>setNearFooter(e.isIntersecting), { threshold:0.1 });
    f && ioF.observe(f);
    const isFormEl = el => el && el.closest && el.closest('input,select,textarea,#quote form');
    const onFocusIn = e => { if(isFormEl(e.target)){ setKbOpen(true); if(e.target.closest('#quote')) setNearQuote(true); } };
    const onFocusOut = e => { if(isFormEl(e.target)) setKbOpen(false); };
    document.addEventListener('focusin', onFocusIn);
    document.addEventListener('focusout', onFocusOut);
    return ()=>{ removeEventListener('scroll', onScroll); ioQ&&ioQ.disconnect(); ioF&&ioF.disconnect(); document.removeEventListener('focusin', onFocusIn); document.removeEventListener('focusout', onFocusOut); };
  },[]);
  const show = scrolled && !nearQuote && !nearFooter && !kbOpen;
  return (
    <div className={"sticky-cta"+(show?" show":"")}>
      <span className="lab">Get your price in 60 seconds</span>
      <Button variant="ink" sticker onClick={seeMyPrice}>See My Price</Button>
    </div>
  );
}

function App(){
  useEffect(()=>{ window.ddInitTrackers(); window.ddGetUTM(); track('ViewContent'); },[]);
  useEffect(()=>{ const t=setInterval(()=>window.lucide&&window.lucide.createIcons(),400); return ()=>clearInterval(t); },[]);
  useEffect(()=>{
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const els = [...document.querySelectorAll('.reveal')];
    const show = el => el.classList.add('in');
    if(reduce){ els.forEach(show); return; }
    const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ show(e.target); io.unobserve(e.target); } }), { rootMargin:'0px 0px -8% 0px', threshold:0 });
    els.forEach(el=>io.observe(el));
    const onScroll = ()=>{ els.forEach(el=>{ if(!el.classList.contains('in') && el.getBoundingClientRect().top < innerHeight*0.95) show(el); }); };
    addEventListener('scroll', onScroll, { passive:true });
    const t = setTimeout(()=>els.forEach(show), 4000);
    return ()=>{ io.disconnect(); removeEventListener('scroll', onScroll); clearTimeout(t); };
  },[]);
  return (<div>
    <PromoBar /><Header /><Hero /><TrustStrip /><VideoSec /><Reviews /><Plans /><HowItWorks />
    <ServiceArea /><Process /><Guarantee /><FAQ /><Story /><Band /><Footer /><StickyCTA />
  </div>);
}
